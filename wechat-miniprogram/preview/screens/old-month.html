<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>文件列表 · v1</title><style>* { box-sizing: border-box; }
html, body { margin: 0; }
view { display: block; }
text { display: inline; }
image { display: inline-block; }
button { font: inherit; border: 0; background: none; margin: 0; padding: 0 14px; color: inherit; line-height: 2.55; }
button::after { border: none; }
input { font: inherit; outline: none; }
::-webkit-scrollbar { width: 0; height: 0; }
.chrome { position: sticky; top: 0; z-index: 50; }
.statusbar { display: flex; justify-content: space-between; padding: 12px 22px 6px; color: #fff; font-size: 12px; font-weight: 600; }
.navbar { display: flex; align-items: center; height: 44px; padding: 0 12px; color: #fff; }
.nv-back { font-size: 26px; line-height: 1; padding: 0 6px; margin-top: -4px; }
.nv-title { flex: 1; text-align: center; font-size: 16px; font-weight: 600; letter-spacing: 1px; }
.nv-side { width: 30px; }
html, body {
  background: #eef1ef;
  font-size: 14px;
  color: #24312e;
  line-height: 1.45;
}

button {
  font-size: 14px;
  margin: 0;
  padding: 0 14px;
  line-height: 2.6;
  box-sizing: border-box;
}

button::after { border: none; }

.page {
  padding: 12px;
  box-sizing: border-box;
  min-height: 100vh;
}

/* 胶片齿孔带：贯穿各页头部的“家庭档案”签名元素 */
.film-strip {
  height: 9px;
  background:
    radial-gradient(circle at 3px 4.5px, #eef1ef 0 1.3px, transparent 1.6px) repeat-x 0 0 / 12px 9px,
    #1c3d3a;
}

.card {
  background: #fff;
  border-radius: 7px;
  padding: 15px;
  margin-bottom: 11px;
  border: 0.5px solid #e3eae6;
  box-shadow: 0 3px 10px rgba(28, 61, 58, 0.06);
}

.btn-primary {
  background: #d9822b;
  color: #fff;
  border-radius: 7px;
  box-shadow: 0 4px 11px rgba(217, 130, 43, 0.28);
}

.btn-primary[disabled] { background: #e9c9a3; color: #fff; box-shadow: none; }
.btn-primary.big { height: 46px; line-height: 46px; font-size: 15px; font-weight: 600; letter-spacing: 2px; }

.btn-outline {
  background: #fff;
  color: #1c3d3a;
  border: 1px solid #1c3d3a;
  border-radius: 7px;
}

.btn-outline[disabled] { color: #aab9b4; border-color: #cfe0da; background: #f6f9f7; }

.btn-ghost {
  background: #e3eae6;
  color: #2c4f4b;
  border-radius: 6px;
  font-size: 13px;
}

.btn-danger {
  background: #cf4a3a;
  color: #fff;
  border-radius: 6px;
  font-size: 13px;
}

.btn-danger[disabled] { background: #e7b7b0; color: #fff; }

.section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 4px 4px 10px;
  color: #1c3d3a;
}

.empty { text-align: center; color: #7c9a92; margin-top: 80px; }
.empty-icon { font-size: 44px; margin-bottom: 10px; }
.empty-text { font-size: 13px; }

.fab {
  position: fixed;
  right: 20px;
  bottom: calc(30px + env(safe-area-inset-bottom));
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #d9822b;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 15px rgba(217, 130, 43, 0.35);
  z-index: 10;
}

.fab-plus { font-size: 30px; line-height: 1; }

.day-section { margin-bottom: 16px; }
.day-header {
  display: flex;
  align-items: center;
  margin: 4px 4px 8px;
}
.day-header::before {
  content: '';
  width: 5px;
  height: 13px;
  border-radius: 2.5px;
  background: #d9822b;
  margin-right: 6px;
}
.day-label { font-size: 14.5px; font-weight: 700; color: #1c3d3a; }
.day-count {
  margin-left: 7px;
  font-size: 10px;
  color: #7c9a92;
  background: #e3eae6;
  border-radius: 499.5px;
  padding: 1.5px 8px;
}
.grid { display: flex; flex-wrap: wrap; padding: 0 0 8px; }
.cell {
  position: relative;
  box-sizing: border-box;
  width: 31.5%;
  margin: 1% 0.75%;
  background: #fff;
  border: 0.5px solid #e3eae6;
  border-radius: 5px;
  overflow: hidden;
  box-shadow: 0 2px 7px rgba(28, 61, 58, 0.07);
}
.cell.press { opacity: 0.8; }
.thumb { width: 100%; height: 100px; display: block; }
.thumb.placeholder {
  height: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: #7c9a92;
  background: linear-gradient(180deg, #f4f6f4, #e8ede9);
  padding: 4px;
  box-sizing: border-box;
}
.thumb.placeholder.video { color: #d9822b; }
.err-text {
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  word-break: break-all;
}
.video-badge {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(28, 61, 58, 0.55);
  color: #fff;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.video-play {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #fbe7d3;
  color: #d9822b;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}
.video-name { word-break: break-all; text-align: center; max-height: 28px; overflow: hidden; }
.check {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 20px;
  height: 20px;
  line-height: 20px;
  text-align: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.96);
  color: #bbb;
  font-size: 13px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 1px 4px rgba(28, 61, 58, 0.12);
}
.check.checked { background: #d9822b; color: #fff; border-color: #d9822b; }
.edit-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: #fff;
  box-shadow: 0 -3px 12px rgba(28, 61, 58, 0.08);
}
.edit-count { flex: 1; font-size: 13px; color: #1c3d3a; }
.edit-bar button { margin-left: 8px; font-size: 12px; padding: 0 10px; line-height: 2.4; }
.edit-bar .btn-outline.mini { color: #1c3d3a; }
.edit-bar .btn-danger { margin-right: 8px; }
.edit-fab {
  position: fixed;
  right: 20px;
  bottom: calc(30px + env(safe-area-inset-bottom));
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  background: #d9822b;
  color: #fff;
  box-shadow: 0 6px 15px rgba(217, 130, 43, 0.35);
  z-index: 10;
}
.edit-fab.press { opacity: 0.85; }
.video-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #000;
  z-index: 99;
  display: flex;
  align-items: center;
  justify-content: center;
}
.video-player { width: 100%; height: 100%; }
.video-close {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(28, 61, 58, 0.55);
  color: #fff;
  font-size: 22px;
  line-height: 32px;
  text-align: center;
  z-index: 10;
}

/* ---- 预览占位照片(只动背景) ---- */

.mock-photo.m3 { background: linear-gradient(140deg, #7E93B8 0%, #55688C 55%, #374664 100%) !important; }
.mock-photo.m4 { background: linear-gradient(165deg, #B98A7E 0%, #8C5F55 58%, #5F3E37 100%) !important; }
