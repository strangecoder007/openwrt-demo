view { display: block; }

button::after { border: none; }

/* ============================================================
   云盘 · 设计系统 v2「墨绿档案 · Premium」
   —— 令牌化 / 大留白 / 层级字阶 / 双层柔和阴影 / 微交互 / 明暗双主题
   约定：令牌名表达“角色”而非“颜色值”，换主题只改值不改用法。
     --brand      品牌色当作“面”用（hero 渐变、胶片带）
     --brand-ink  品牌色当作“字/图标”用（卡片标题、描边按钮）
     --accent-ink 琥珀当作“字”用（胶囊文字、图标）；--accent-deep 只用于渐变收尾

   前景色令牌按“底色角色”拆分，一个底面对应一个前景，不可互相借用：
     --on-brand   压在 --brand 面（深墨绿）上的前景
     --on-accent  压在琥珀渐变 / 琥珀实色面（.btn-primary .fab .edit-fab .check.checked）上的前景
     --on-danger  压在危险实色面（--danger-fill，.btn-danger）上的前景
     --on-scrim   压在半透明深色遮罩（--scrim）上的前景。遮罩两个主题下都是深色，
                  故该令牌主题无关，始终为浅色。
   注：--on-accent 在亮色下取白、在暗色下取深墨。原因是暗色主题把琥珀整体调亮
   （#D9822B→#E09A4B），白字压浅琥珀仅 2.08:1，必须反过来用深墨字才达标。
   详见 preview/_contrast_audit.py 的实测值。
   ============================================================ */

html, body {
  /* —— 品牌 —— */
  --brand: #17352E;
  --brand-deep: #10241F;
  --brand-ink: #17352E;
  --brand-tint: #E7F0EC;
  --hero-1: #1E433A;
  --hero-glow: rgba(217, 130, 43, 0.14);

  /* —— 强调色（琥珀，克制使用） —— */
  --accent: #D9822B;
  --accent-lite: #E2964C;
  --accent-deep: #A95F14;
  --accent-ink: #A15B13;
  /* 选中态光晕（照片格子的琥珀外圈） */
  --accent-ring: rgba(217, 130, 43, 0.22);
  --accent-tint: #FBF1E4;

  /* —— 文字 ——
     三级字阶（对页面底 #EEF2EF 的实测对比度，AA 需 >=4.5:1）：
       --ink   正文/标题      13.16:1
       --ink-2 次要标签        5.82:1
       --ink-3 三级信息        4.60:1
     ink-2 曾取 #5C6F6A(4.72:1)、ink-3 曾取 #6D7E78(3.79:1，未达标)。
     为了让 ink-3 达标又不和 ink-2 撞色，两级同时压深：
     相邻可辨亮度比 1.33 -> 1.39，比改动前更容易区分。
  */
  --ink: #182B26;
  --ink-2: #4F615B;
  --ink-3: #61706B;

  /* —— 面 —— */
  --bg: #EEF2EF;
  --surface: #FFFFFF;
  --surface-2: #F6F8F6;
  --surface-3: #E2EAE6;
  /* 详情页媒体区底色：纯黑，做成和原生「查看原图」一致的沉浸式观感。
     detail.json 的导航栏也配成 #000000 —— 两处必须一起改，否则又是一道接缝。 */
  --media-bg: #000000;
  --glass: rgba(255, 255, 255, 0.95);
  --on-brand: #FFFFFF;
  /* hero 底在两个主题下都是深墨绿，故 hero 的三级前景令牌主题无关。
     原先把 .eyebrow / .hero-sub 的白色透明度写死在页面样式里，
     小标签用 0.45（压 hero 最浅端仅 3.58:1）不达标，统一提到 0.55。 */
  --on-brand-soft: rgba(255, 255, 255, 0.70);
  --on-brand-dim: rgba(255, 255, 255, 0.55);
  --on-accent: #FFFFFF;
  --on-scrim: #FFFFFF;
  /* 媒体区（--media-bg，两主题都是纯黑）上悬浮控件用的浅色薄纱底/描边。
     与 --on-scrim 成对出现：--on-scrim 当字，--scrim-soft 当薄纱面。主题无关。 */
  --scrim-soft: rgba(255, 255, 255, 0.14);
  --ghost-fg: #3B5A52;
  --dot-idle: #B6C4BF;

  /* —— 语义色 —— */
  --ok: #35784C;
  --ok-tint: #E6F2EA;
  /* --danger：危险色当作“字/图标/描边”用（错误文字、失败态标签） */
  --danger: #B94132;
  --danger-tint: #F9E9E6;
  /* --danger-fill：危险色当作“实色填充面”用；暗色下必须比 --danger 更深
     （暗色的 --danger 是提亮后的浅鲑红，只适合当字，不能承白字） */
  --danger-fill: #B94132;
  --on-danger: #FFFFFF;

  /* —— 禁用态 —— */
  --disabled-bg: #E7CDA9;
  --disabled-fg: #FFF9F0;
  --outline-off-border: #CFDCD6;
  --danger-off-bg: #E5B3AB;
  --danger-off-fg: #FFF6F4;

  /* —— 骨架屏 —— */
  --skeleton-bg: #E7ECE8;
  --skeleton-sheen: rgba(255, 255, 255, 0.65);

  /* —— 线与影 —— */
  --line: rgba(24, 43, 38, 0.08);
  --line-strong: rgba(24, 43, 38, 0.14);
  --scrim: rgba(16, 36, 31, 0.55);
  --shadow-1: 0 0.5px 1px rgba(24, 43, 38, 0.04), 0 5px 14px -5px rgba(24, 43, 38, 0.10);
  --shadow-2: 0 1px 2px rgba(24, 43, 38, 0.05), 0 9px 22px -6px rgba(24, 43, 38, 0.16);
  --shadow-press: 0 0.5px 1px rgba(24, 43, 38, 0.04), 0 3px 8px -4px rgba(24, 43, 38, 0.08);
  --shadow-accent: 0 3px 8px rgba(193, 111, 30, 0.22), 0 9px 20px -4px rgba(193, 111, 30, 0.34);

  /* —— 圆角 / 缓动 —— */
  --r-lg: 16px;
  --r-md: 11px;
  --r-sm: 7px;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --t-fast: 160ms;
  --t-mid: 260ms;

  background: var(--bg);
  font-size: 14px;
  color: var(--ink);
  line-height: 1.5;
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
}

/* —— 暗色主题：只覆盖令牌值，组件样式零改动 —— */
@media (prefers-color-scheme: dark) {
  html, body {
    --brand: #11241F;
    --brand-deep: #0A1714;
    --brand-ink: #A9CFBF;
    --brand-tint: #1B2C27;
    --hero-1: #17362F;
    --hero-glow: rgba(224, 154, 75, 0.16);

    --accent: #E09A4B;
    --accent-lite: #E8A75D;
    --accent-deep: #B06A1C;
    --accent-ink: #EDB57A;
    --accent-tint: #2C2216;
    --accent-ring: rgba(224, 154, 75, 0.30);

    /* 前景色：琥珀在暗色下被调亮，白字压不住（2.08:1），改用深墨字（中心 7.07:1） */
    --on-brand: #FFFFFF;
    /* hero 底两主题同为深墨绿，与亮色块同值（见亮色块注释） */
    --on-brand-soft: rgba(255, 255, 255, 0.70);
    --on-brand-dim: rgba(255, 255, 255, 0.55);
    --on-accent: #2A1B08;
    --on-danger: #FFFFFF;
    /* 遮罩在两个主题下都是深色，故此前景主题无关 */
    --on-scrim: #FFFFFF;
    --scrim-soft: rgba(255, 255, 255, 0.14);

    --ink: #E9EEEC;
    --ink-2: #A7B7B2;
    --ink-3: #87978F;

    --bg: #0D1412;
    --surface: #16211E;
    --surface-2: #1D2A26;
    --surface-3: #24322D;
    /* 媒体区底色纯黑，两主题同值（见亮色块注释） */
    --media-bg: #000000;
    --glass: rgba(22, 33, 30, 0.95);
    --ghost-fg: #C3D6CF;
    --dot-idle: #55655F;

    --ok: #6FBB8A;
    --ok-tint: #172A20;
    --danger: #E48170;
    --danger-tint: #2C1A17;
    /* 实色填充面用更深的红，白字 5.32:1（--danger 本身配白字仅 2.74:1） */
    --danger-fill: #B8453A;

    --disabled-bg: #3A3226;
    --disabled-fg: #7D7266;
    --outline-off-border: #2A3833;
    --danger-off-bg: #3A2622;
    --danger-off-fg: #8C6A63;

    --skeleton-bg: #1F2B27;
    --skeleton-sheen: rgba(255, 255, 255, 0.06);

    --line: rgba(233, 238, 236, 0.10);
    --line-strong: rgba(233, 238, 236, 0.18);
    --scrim: rgba(6, 14, 12, 0.62);
    --shadow-1: 0 0.5px 1px rgba(0, 0, 0, 0.30), 0 5px 14px -5px rgba(0, 0, 0, 0.45);
    --shadow-2: 0 1px 2px rgba(0, 0, 0, 0.35), 0 9px 22px -6px rgba(0, 0, 0, 0.55);
    --shadow-press: 0 0.5px 1px rgba(0, 0, 0, 0.28), 0 3px 8px -4px rgba(0, 0, 0, 0.35);
    --shadow-accent: 0 3px 8px rgba(0, 0, 0, 0.40), 0 9px 20px -4px rgba(0, 0, 0, 0.50);
  }
}

button {
  font-size: 14px;
  margin: 0;
  padding: 0 14px;
  line-height: 2.55;
  box-sizing: border-box;
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease),
    opacity var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease);
}

button::after { border: none; }

.page {
  padding: 16px;
  box-sizing: border-box;
  min-height: 100vh;
}

/* 胶片齿孔带：品牌签名元素 */
.film-strip {
  height: 9px;
  background:
    radial-gradient(circle at 3px 4.5px, var(--bg) 0 1.3px, transparent 1.6px) repeat-x 0 0 / 12px 9px,
    var(--brand);
}

/* —— 卡片：大圆角 + 发丝线 + 双层影 —— */
.card {
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: 17px;
  margin-bottom: 12px;
  border: 0.5px solid var(--line);
  box-shadow: var(--shadow-1);
}

/* —— 按钮 —— */
.btn-primary {
  background: linear-gradient(135deg, var(--accent-lite) 0%, var(--accent) 55%, var(--accent-deep) 100%);
  color: var(--on-accent);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-accent);
  font-weight: 600;
}
.btn-primary[disabled] { background: var(--disabled-bg); color: var(--disabled-fg); box-shadow: none; }
.btn-primary.big {
  height: 48px;
  line-height: 48px;
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: 3px;
  border-radius: 24px;
}

.btn-outline {
  background: var(--surface);
  color: var(--brand-ink);
  border: 1px solid var(--brand-ink);
  border-radius: var(--r-md);
  font-weight: 500;
}
.btn-outline[disabled] { color: var(--ink-3); border-color: var(--outline-off-border); background: var(--surface-2); }

.btn-ghost {
  background: var(--surface-2);
  color: var(--ghost-fg);
  border-radius: var(--r-sm);
  font-size: 13px;
}

.btn-danger {
  background: var(--danger-fill);
  color: var(--on-danger);
  border-radius: var(--r-sm);
  font-size: 13px;
}
.btn-danger[disabled] { background: var(--danger-off-bg); color: var(--danger-off-fg); }

/* 按压反馈：所有按钮统一缩放微动效 */
button.press, .btn-primary.press, .btn-outline.press, .btn-ghost.press, .btn-danger.press {
  transform: scale(0.96);
  opacity: 0.92;
}

/* —— 区块标题：小字号 + 宽字距的“标签式”层级 —— */
.section-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--ink-2);
  margin: 6px 4px 13px;
}

/* —— 空态 —— */
.empty { text-align: center; color: var(--ink-3); margin-top: 90px; }
.empty-icon { font-size: 42px; margin-bottom: 12px; opacity: 0.55; }
.empty-text { font-size: 13px; letter-spacing: 0.5px; }

/* —— FAB：渐变琥珀 + 长影 + 按压缩放 —— */
.fab {
  position: fixed;
  right: 22px;
  bottom: calc(32px + env(safe-area-inset-bottom));
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: linear-gradient(150deg, var(--accent-lite) 0%, var(--accent) 60%, var(--accent-deep) 100%);
  color: var(--on-accent);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-accent);
  z-index: 10;
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.fab.press { transform: scale(0.92); box-shadow: var(--shadow-1); }
.fab-plus { font-size: 29px; line-height: 1; font-weight: 300; margin-top: -3px; }

/* —— 骨架屏：微光扫过 —— */
.skeleton {
  position: relative;
  overflow: hidden;
  background: var(--skeleton-bg);
}
.skeleton::after {
  content: '';
  /* 不用 inset 简写：部分机型内核不支持会整条失效 */
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent 0%, var(--skeleton-sheen) 50%, transparent 100%);
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer {
  100% { transform: translateX(100%); }
}

/* —— 徽标 / 胶囊 —— */
.pill {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  line-height: 1;
  padding: 5px 10px;
  border-radius: 499.5px;
  background: var(--surface-2);
  color: var(--ink-2);
}
.pill-accent { background: var(--accent-tint); color: var(--accent-ink); }
.pill-ok { background: var(--ok-tint); color: var(--ok); }
.pill-danger { background: var(--danger-tint); color: var(--danger); }

.home-page { padding: 0 0 100px; }

/* —— Hero：更深的渐变 + 顶部环境光 —— */
.hero {
  margin: -16px -16px 0;
  background:
    radial-gradient(120% 90% at 85% -10%, var(--hero-glow) 0%, transparent 55%),
    linear-gradient(165deg, var(--hero-1) 0%, var(--brand) 48%, var(--brand-deep) 100%);
  border-radius: 0 0 20px 20px;
  color: var(--on-brand);
  padding: 0 0 32px;
}
.hero-body { padding: 26px 20px 0; }
.hero-eyebrow {
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--on-brand-dim);
  margin-bottom: 7px;
}
.hero-title { font-size: 26px; font-weight: 700; letter-spacing: 1.5px; }
.hero-sub { font-size: 12px; color: var(--on-brand-soft); margin-top: 7px; letter-spacing: 0.5px; }
.hero-rule {
  width: 28px;
  height: 2px;
  border-radius: 1px;
  background: var(--accent);
  margin-top: 15px;
}

/* —— 月份卡：图标位 + 悬浮箭头 + 按压微动效 —— */
.month-list { padding: 16px 16px 0; }
.month-card {
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 0.5px solid var(--line);
  border-radius: var(--r-lg);
  padding: 15px 13px 15px 15px;
  margin-bottom: 11px;
  box-shadow: var(--shadow-1);
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-mid) var(--ease);
}
.month-card.press {
  transform: scale(0.97);
  box-shadow: var(--shadow-press);
}
.month-icon {
  width: 44px;
  height: 44px;
  border-radius: 13px;
  background: var(--accent-tint);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 13px;
  flex-shrink: 0;
}
.icon-img { width: 22px; height: 22px; }
.month-info { flex: 1; min-width: 0; }
.month-name {
  font-size: 17px;
  font-weight: 700;
  color: var(--brand-ink);
  letter-spacing: 0.5px;
  font-feature-settings: "tnum";
}
.month-count { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; letter-spacing: 0.5px; }

/* chevron：CSS 画的细箭头，放在发丝圆环里 */
.month-arrow {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 0.5px solid var(--line-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: 6px;
  flex-shrink: 0;
}
.chev {
  width: 7px;
  height: 7px;
  border-top: 1.5px solid var(--ink-2);
  border-right: 1.5px solid var(--ink-2);
  transform: rotate(45deg) translate(-0.5px, -0.5px);
  border-radius: 1px;
}

/* —— 骨架卡 —— */
.skeleton-card { padding: 14px 13px 14px 15px; }
.sk-icon { width: 44px; height: 44px; border-radius: 13px; margin-right: 13px; flex-shrink: 0; }
.sk-lines { flex: 1; }
.sk-line { height: 15px; border-radius: 4px; margin-bottom: 8px; }
.sk-line-sm { height: 11px; margin-bottom: 0; }
