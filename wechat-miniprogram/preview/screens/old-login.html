  margin: 0;

.page {
  padding: 12px;

  min-height: 100vh;
}

/* 胶片齿孔带：贯穿各页头部的“家庭档案”签名元素 */
.film-strip {
  height: 9px;
  background:
    radial-gradient(circle at 3px 4.5px, #eef1ef 0 1.3px, transparent 1.6px) repeat-x 0 0 / 12px 9px,
    #1c3d3a;
}

.card {
  background: #fff;
  border-radius: 7px;
  padding: 15px;
  margin-bottom: 11px;
  border: 0.5px solid #e3eae6;
  box-shadow: 0 3px 10px rgba(28, 61, 58, 0.06);
}

.btn-primary {
  background: #d9822b;
  color: #fff;
  border-radius: 7px;
  box-shadow: 0 4px 11px rgba(217, 130, 43, 0.28);
}

.btn-primary[disabled] { background: #e9c9a3; color: #fff; box-shadow: none; }
.btn-primary.big { height: 46px; line-height: 46px; font-size: 15px; font-weight: 600; letter-spacing: 2px; }

.btn-outline {
  background: #fff;
  color: #1c3d3a;
  border: 1px solid #1c3d3a;
  border-radius: 7px;
}

.btn-outline[disabled] { color: #aab9b4; border-color: #cfe0da; background: #f6f9f7; }

.btn-ghost {
  background: #e3eae6;
  color: #2c4f4b;
  border-radius: 6px;
  font-size: 13px;
}

.btn-danger {
  background: #cf4a3a;
  color: #fff;
  border-radius: 6px;
  font-size: 13px;
}

.btn-danger[disabled] { background: #e7b7b0; color: #fff; }

.section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 4px 4px 10px;
  color: #1c3d3a;
}

.empty { text-align: center; color: #7c9a92; margin-top: 80px; }
.empty-icon { font-size: 44px; margin-bottom: 10px; }
.empty-text { font-size: 13px; }

.fab {
  position: fixed;
  right: 20px;
  bottom: calc(30px + env(safe-area-inset-bottom));
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #d9822b;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 15px rgba(217, 130, 43, 0.35);
  z-index: 10;
}

.fab-plus { font-size: 30px; line-height: 1; }

.login-page { padding: 0 12px 24px; min-height: 100vh; }
.hero {
  margin: -12px -12px 0;
  background: linear-gradient(168deg, #1c3d3a 0%, #2c4f4b 100%);
  border-radius: 0 0 15px 15px;
  color: #fff;
  padding: 0 0 32px;
}
.hero-body { padding: 32px 16px 0; text-align: center; }
.logo {
  width: 64px;
  height: 64px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  border: 0.5px solid rgba(255, 255, 255, 0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}
.title { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
.subtitle { font-size: 12px; color: rgba(255, 255, 255, 0.72); margin-top: 6px; }
.card { margin: -19px 0 0; padding: 17px 15px 15px; position: relative; z-index: 1; }
.field-group { margin-bottom: 15px; }
.field-label { font-size: 11px; color: #7c9a92; display: block; margin-bottom: 5px; letter-spacing: 0.5px; }
.field {
  background: #f2f5f3;
  border: 0.5px solid #e3eae6;
  border-radius: 5px;
  padding: 11px 12px;
  font-size: 14px;
}
.remember-row {
  display: flex;
  align-items: center;
  margin: -1px 0 15px;
}
.remember-label {
  display: flex;
  align-items: center;
  font-size: 12.5px;
  color: #5b6f6b;
}
.remember-label checkbox {
  transform: scale(0.85);
  margin-right: 2px;
}
.register-link { text-align: center; font-size: 13px; color: #1c3d3a; margin-top: 13px; font-weight: 500; }
.register-link:active { opacity: 0.7; }
.version {
  text-align: center;
  font-size: 11px;
  color: #aab9b4;
  margin-top: 20px;
}
